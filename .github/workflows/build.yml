name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          cp "$APK" release/angry-birds.apk
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angry-birds-apk
          path: release/angry-birds.apk

      - name: Remove previous release
        run: gh release delete apk-latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Angry Birds — свежая сборка
          body: Автоматическая сборка из ветки main. Скачай angry-birds.apk и установи на телефон.
          files: release/angry-birds.apk
          make_latest: true
