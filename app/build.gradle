plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cim.angrybirds'
    compileSdk 34

    defaultConfig {
        applicationId "com.cim.angrybirds"
        minSdk 21
        targetSdk 34
        // ИСПРАВЛЕНИЕ: versionCode не менялся, поэтому Android
        // мог считать новую сборку той же версией и не обновлять её.
        versionCode 3
        versionName "1.3"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
